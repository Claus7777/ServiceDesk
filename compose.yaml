name: service-desk
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-service_desk}
      POSTGRES_USER: ${POSTGRES_USER:-service_desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-service_desk}
      DB_USER: ${POSTGRES_USER:-service_desk}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend-tests:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /app
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    command: ["mvn", "-B", "test"]
  frontend-tests:
    build:
      context: ./frontend
      target: test
    profiles: ["test"]
volumes:
  postgres-data:
  maven-cache:
